<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- PWA / Mobile meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e1e2e">
  <title>Mi App — Menú de Equipo</title>
  <style>
    /* ===== Reset & Variables ===== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --sidebar-bg: #1e1e2e;
      --sidebar-hover: #2a2a3d;
      --sidebar-active: #3b3b55;
      --accent: #7c5cfc;
      --accent-glow: rgba(124, 92, 252, 0.35);
      --content-bg: #f4f4f8;
      --card-bg: #ffffff;
      --text-light: #e0e0e8;
      --text-muted: #9090a8;
      --text-dark: #2e2e3a;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s ease;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      background: var(--sidebar-bg);
    }

    /* ==============================================
       DESKTOP: Sidebar lateral izquierdo
       ============================================== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 32px 20px 24px;
      gap: 8px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 20px;
    }

    .sidebar-brand .logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      font-weight: 700;
    }

    .sidebar-brand h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-light);
      letter-spacing: -0.3px;
    }

    .sidebar-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      padding: 8px 12px 6px;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .sidebar-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 4px;
      height: 70%;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
      transition: transform var(--transition);
    }

    .sidebar-btn:hover {
      background: var(--sidebar-hover);
      color: var(--text-light);
    }

    .sidebar-btn.active {
      background: linear-gradient(135deg, rgba(124,92,252,0.25), rgba(124,92,252,0.10));
      color: #fff;
      box-shadow: inset 0 0 0 1.5px rgba(124,92,252,0.35),
                  0 0 20px rgba(124,92,252,0.12);
    }

    .sidebar-btn.active::before {
      transform: translateY(-50%) scaleY(1);
    }

    .sidebar-btn .icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 20px;
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .sidebar-btn .label {
      pointer-events: none;
    }

    .sidebar-btn.active .icon {
      background: var(--accent);
      box-shadow: 0 4px 18px var(--accent-glow);
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 8px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* ===== Main Content ===== */
    .main {
      flex: 1;
      background: var(--content-bg);
      border-radius: 24px 0 0 24px;
      padding: 36px 44px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: background 0.5s ease;
    }

    .main-header {
      margin-bottom: 32px;
    }

    .main-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .main-header p {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ===== Section containers ===== */
    .section {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .section.active {
      display: flex;
    }

    /* ===== Color Generator ===== */
    .color-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      transition: background-color 0.5s ease;
      min-height: 300px;
      position: relative;
      cursor: pointer;
    }

    .color-display .color-hex-code {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: 3px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.25);
      user-select: all;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .color-display .color-hex-code.pop {
      animation: popIn 0.4s ease;
    }

    @keyframes popIn {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .color-display .color-hint {
      font-size: 16px;
      font-weight: 500;
      margin-top: 16px;
      opacity: 0.8;
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
    }

    .color-display .copied-msg {
      position: absolute;
      bottom: 28px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 8px 22px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .color-display .copied-msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: #6a49e6;
      box-shadow: 0 6px 22px var(--accent-glow);
      transform: translateY(-1px);
    }

    .color-btn-wrap {
      text-align: center;
      margin-top: 20px;
    }

    /* ===== Clock Section ===== */
    .clock-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .digital-clock {
      font-size: 96px;
      font-weight: 800;
      color: var(--text-dark);
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
      text-shadow: 0 2px 20px rgba(124,92,252,0.15);
    }

    .digital-clock .sep {
      color: var(--accent);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .digital-date {
      font-size: 18px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 16px;
      letter-spacing: 0.5px;
    }

    /* ===== Animations ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .section.active {
      animation: fadeIn 0.4s ease;
    }

    /* ==============================================
       MÓVIL: Barra de navegación inferior
       ============================================== */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      /* --- Sidebar se convierte en barra inferior --- */
      .sidebar {
        order: 2;
        width: 100%;
        min-width: unset;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        padding-bottom: calc(8px + var(--safe-bottom));
        gap: 6px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }

      .sidebar-brand,
      .sidebar-label,
      .sidebar-footer {
        display: none;
      }

      .sidebar-btn {
        flex: 1;
        max-width: 160px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 10px 8px;
        border-radius: 14px;
        font-size: 11px;
      }

      .sidebar-btn::before {
        /* Cambia de barra lateral a barra superior */
        left: 50%;
        top: 0;
        bottom: auto;
        width: 50%;
        height: 3px;
        border-radius: 0 0 4px 4px;
        transform: translateX(-50%) scaleX(0);
        transform-origin: center;
      }

      .sidebar-btn.active::before {
        transform: translateX(-50%) scaleX(1);
      }

      .sidebar-btn .icon {
        width: 36px;
        height: 36px;
        font-size: 20px;
        border-radius: 12px;
      }

      .sidebar-btn .label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* --- Main ocupa todo el espacio arriba --- */
      .main {
        order: 1;
        flex: 1;
        border-radius: 0;
        padding: 24px 20px;
        min-height: 0;
      }

      .main-header {
        margin-bottom: 20px;
      }

      .main-header h2 {
        font-size: 22px;
      }

      .main-header p {
        font-size: 13px;
      }

      /* --- Color generator móvil --- */
      .color-display {
        min-height: 200px;
      }

      .color-display .color-hex-code {
        font-size: 44px;
        letter-spacing: 2px;
      }

      .color-display .color-hint {
        font-size: 14px;
      }

      .color-display .copied-msg {
        bottom: 16px;
        font-size: 13px;
      }

      .color-btn-wrap .btn {
        font-size: 15px;
        padding: 14px 28px;
        width: 100%;
        justify-content: center;
        border-radius: 14px;
      }

      /* --- Clock móvil --- */
      .clock-center {
        min-height: 200px;
      }

      .digital-clock {
        font-size: 52px;
        letter-spacing: 2px;
      }

      .digital-date {
        font-size: 14px;
        text-align: center;
        padding: 0 10px;
      }
    }

    /* Extra pequeño (iPhone SE, etc.) */
    @media (max-width: 380px) {
      .color-display .color-hex-code {
        font-size: 36px;
      }

      .digital-clock {
        font-size: 42px;
      }

      .sidebar-btn .label {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR / BARRA INFERIOR EN MÓVIL ===== -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">M</div>
      <h1>Mi App</h1>
    </div>

    <span class="sidebar-label">Herramientas</span>

    <button class="sidebar-btn active" data-section="colors" onclick="switchSection('colors')">
      <div class="icon">🎨</div>
      <span class="label">Colores</span>
    </button>

    <button class="sidebar-btn" data-section="clock" onclick="switchSection('clock')">
      <div class="icon">🕐</div>
      <span class="label">Reloj</span>
    </button>

    <div class="sidebar-footer">
      © 2026 Mi App
    </div>
  </aside>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main" id="mainArea">

    <!-- ── Color Generator ── -->
    <div class="section active" id="sec-colors">
      <div class="main-header">
        <h2>🎨 Generador de Colores</h2>
        <p>Toca el área o el botón para generar un color aleatorio. Toca el código HEX para copiarlo.</p>
      </div>

      <div class="color-display" id="colorDisplay" onclick="generateRandomColor()">
        <div class="color-hex-code" id="colorHexCode">#F4F4F8</div>
        <div class="color-hint" id="colorHint">Toca aquí para generar un color</div>
        <div class="copied-msg" id="copiedMsg">✓ ¡Color copiado!</div>
      </div>

      <div class="color-btn-wrap">
        <button class="btn btn-primary" onclick="generateRandomColor()" style="font-size: 16px; padding: 14px 32px;">
          🎲 Generar Color Aleatorio
        </button>
      </div>
    </div>

    <!-- ── Clock ── -->
    <div class="section" id="sec-clock">
      <div class="clock-center">
        <div class="digital-clock" id="digitalClock">00:00:00</div>
        <div class="digital-date" id="digitalDate"></div>
      </div>
    </div>
  </main>

  <script>
    /* ========== Section Switching ========== */
    let lastColorBg = null;

    function switchSection(name) {
      const main = document.getElementById('mainArea');

      if (name === 'clock') {
        lastColorBg = main.style.background || null;
        main.style.background = 'var(--content-bg)';
      } else if (name === 'colors' && lastColorBg) {
        main.style.background = lastColorBg;
      }

      document.querySelectorAll('.sidebar-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.section === name);
      });
      document.querySelectorAll('.section').forEach(sec => {
        sec.classList.toggle('active', sec.id === `sec-${name}`);
      });
    }

    /* ========== Color Generator ========== */
    function randomHex() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0').toUpperCase();
    }

    function isLightColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55;
    }

    function generateRandomColor() {
      const color = randomHex();
      const display = document.getElementById('colorDisplay');
      const hexCode = document.getElementById('colorHexCode');
      const hint    = document.getElementById('colorHint');
      const main    = document.getElementById('mainArea');
      const textColor = isLightColor(color) ? '#1e1e2e' : '#ffffff';

      main.style.background = color;

      display.style.background = 'transparent';
      hexCode.textContent = color;
      hexCode.style.color = textColor;
      hint.style.color = textColor;
      hint.textContent = 'Toca para generar otro color';

      hexCode.classList.remove('pop');
      void hexCode.offsetWidth;
      hexCode.classList.add('pop');
    }

    // Copy HEX on tap
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('colorHexCode').addEventListener('click', (e) => {
        e.stopPropagation();
        const hex = document.getElementById('colorHexCode').textContent;
        navigator.clipboard.writeText(hex).then(() => {
          const msg = document.getElementById('copiedMsg');
          msg.classList.add('show');
          setTimeout(() => msg.classList.remove('show'), 1500);
        });
      });
    });

    /* ========== Clock ========== */
    let clockInterval = null;

    function tickClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const h = pad(now.getHours());
      const m = pad(now.getMinutes());
      const s = pad(now.getSeconds());

      document.getElementById('digitalClock').innerHTML =
        `${h}<span class="sep">:</span>${m}<span class="sep">:</span>${s}`;

      const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
      const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                       'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      document.getElementById('digitalDate').textContent =
        `${days[now.getDay()]}, ${now.getDate()} de ${months[now.getMonth()]} de ${now.getFullYear()}`;
    }

    function startClock() {
      tickClock();
      if (clockInterval) clearInterval(clockInterval);
      clockInterval = setInterval(tickClock, 1000);
    }

    /* ========== Init ========== */
    startClock();
  </script>
</body>
</html>
